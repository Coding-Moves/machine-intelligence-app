name: Scheduled ingest

on:
  schedule:
    # 08:00 and 20:00 Pakistan Standard Time (UTC+5).
    - cron: "0 3,15 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ingest-${{ github.ref }}
  cancel-in-progress: false

jobs:
  run-ingest:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Fetch trusted sources and prepare stories
        env:
          NEXT_PUBLIC_SITE_URL: ${{ secrets.APP_URL }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          WRITER_MODEL: ${{ vars.WRITER_MODEL }}
          DESIGNER_MODEL: ${{ vars.DESIGNER_MODEL }}
        run: npm run ingest:once
