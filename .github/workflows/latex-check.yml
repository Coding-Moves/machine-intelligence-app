name: LaTeX check

on:
  push:
    paths:
      - "latex/**"
      - ".github/workflows/latex-check.yml"
  pull_request:
    paths:
      - "latex/**"
      - ".github/workflows/latex-check.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: latex-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compile-reference:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Generate magazine renderer smoke file
        run: WRITE_LATEX_SMOKE=1 node --experimental-strip-types --test tests/magazine-render.test.mjs
      - name: Compile the May reference
        uses: xu-cheng/latex-action@v4
        with:
          texlive_version: 2026
          root_file: latex/reference/may-2026.tex
          work_in_root_file_dir: true
          args: -pdf -file-line-error -halt-on-error -interaction=nonstopmode
      - name: Compile the generated magazine template with special characters
        uses: xu-cheng/latex-action@v4
        with:
          texlive_version: 2026
          root_file: latex/generated-render-smoke.tex
          work_in_root_file_dir: true
          args: -pdf -file-line-error -halt-on-error -interaction=nonstopmode
      - name: Upload PDF artifact
        uses: actions/upload-artifact@v4
        with:
          name: may-2026-reference
          path: latex/reference/may-2026.pdf
          if-no-files-found: error
