name: LaTeX check

on:
  push:
    paths:
      - "latex/**"
      - ".github/workflows/latex-check.yml"
  pull_request:
    paths:
      - "latex/**"
      - ".github/workflows/latex-check.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: latex-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compile-reference:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Create a plain cover placeholder
        run: |
          sudo apt-get update
          sudo apt-get install --yes imagemagick
          convert -size 900x1300 xc:"#f9f7f1" \
            -fill "#1a3a31" -draw "rectangle 0,0 899,360" \
            -quality 85 latex/reference/cover.jpg
      - name: Compile the May reference
        uses: xu-cheng/latex-action@v4
        with:
          texlive_version: 2026
          root_file: latex/reference/may-2026.tex
          work_in_root_file_dir: true
          args: -pdf -file-line-error -halt-on-error -interaction=nonstopmode
      - name: Upload PDF artifact
        uses: actions/upload-artifact@v4
        with:
          name: may-2026-reference
          path: latex/reference/may-2026.pdf
          if-no-files-found: error
